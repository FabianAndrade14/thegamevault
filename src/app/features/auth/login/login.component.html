<div
  class="login-page"
  (pointermove)="onPointerMove($event)"
  (pointerleave)="resetParallax()"
>

  <!-- ================================= -->
  <!-- BACKGROUND -->
  <!-- ================================= -->

  <div class="background-wall">


    <div
      class="covers-scene"
      [style.--parallax-x]="
        parallaxX + 'px'
      "
      [style.--parallax-y]="
        parallaxY + 'px'
      "
    >

      @for (
        column of backgroundColumns;
        track $index
      ) {

        <div
          class="covers-column"
          [class.reverse]="
            $index % 2 !== 0
          "
        >

          @for (
            cover of column;
            track $index
          ) {

            <div class="cover-card">

              <img
                [src]="cover"
                alt=""
                loading="lazy"
              >

            </div>

          }

        </div>

      }

    </div>


    <div class="background-overlay">
    </div>


    <div class="background-gradient">
    </div>

  </div>


  <!-- ================================= -->
  <!-- LOGIN -->
  <!-- ================================= -->

  <main class="login-content">

    <section class="login-card">


      <div class="vault-logo">
        🎮
      </div>


      <span class="eyebrow">
        THE GAMING VAULT
      </span>


      <h1>
        Tu colección.<br>
        Tu wishlist.<br>
        Tu bóveda.
      </h1>


      <p class="subtitle">

        Organiza los juegos que quieres,
        registra los que ya compraste
        y construye tu colección.

      </p>


      <button
        type="button"
        class="google-button"
        [disabled]="loading"
        (click)="loginWithGoogle()"
      >

        @if (loading) {

          <span>
            Iniciando sesión...
          </span>

        } @else {

          <span class="google-icon">
            G
          </span>

          <span>
            Continuar con Google
          </span>

        }

      </button>


      @if (errorMessage) {

        <p class="error-message">
          {{ errorMessage }}
        </p>

      }

    </section>

  </main>

</div>
